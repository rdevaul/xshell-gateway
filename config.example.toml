# sybild configuration. Copy, edit, and run: sybild run --config PATH

# The assistant's workspace. It holds:
#   SOUL.md, IDENTITY.md, AGENTS.md      who the assistant is and how it works
#   memory/shared/MEMORY.md              what every user's conversations may see
#   memory/personal/NAME/MEMORY.md       one user's memory, seen only in their own
workspace = "/srv/sybil/workspace"

# State of the embedded xshell session daemon (sessions, socket, turn records).
state_directory = "/srv/sybil/state"

# Optional xshell configuration for the embedded daemon: model profiles,
# limits, auditing. Required when [model] names api_key_env: the daemon only
# sends a credential to an endpoint one of its own [models.NAME] profiles
# names with the same provider, base_url and api_key_env.
# xshell_config = "/srv/sybil/xshell.toml"

[model]
profile_name = "local"
provider = "ollama"
model = "qwen3:8b"
base_url = "http://127.0.0.1:11434"
# api_key_env = "OPENROUTER_API_KEY"
# context_tokens = 32768

[telegram]
# The NAME of the environment variable holding the bot token.
token_env = "TELEGRAM_BOT_TOKEN"

# Web search, for the `web` tool group. Remove this section for no web tools.
# SearXNG: the instance must allow the json format (search.formats in its
# settings.yml).
[web_search]
backend = "searxng"
url = "https://searx.example"
# Or the Brave Search API, with the NAME of the variable holding its key:
# backend = "brave"
# api_key_env = "BRAVE_API_KEY"

# Heartbeats: every so often the assistant goes through a checklist and
# messages a user only if something needs their attention. The checklist is
# HEARTBEAT.md at the top of the workspace (everyone's) plus HEARTBEAT.md in a
# user's memory (their own, which their agent can edit). A user with neither
# gets no heartbeat. Remove this section to turn heartbeats off.
[heartbeat]
every_minutes = 30
# Local time. Heartbeats outside these hours are skipped.
active_hours = "08:00-22:00"

# The people the assistant talks to. A message from any other account is
# refused. Find your numeric Telegram id by messaging @userinfobot.
#
# `tools` lists the tool groups a user's agent has:
#   memory    read and write the user's own memory; read shared memory
#   schedule  reminders and scheduled tasks
#   web       web_search (needs [web_search] above)
# Without `tools`, a user gets memory and schedule, plus web when
# [web_search] is configured.
#
# `shell = "unrestricted"` lets a user's agent run any command on this
# machine without asking, as the account sybild runs under. It is NOT
# confined to that user's data: give it only to someone you trust as you
# trust yourself. It needs max_approval = "auto" in the xshell configuration;
# see "Shell" in the README, which also covers logging every command.
[[users]]
name = "alice"
telegram_id = 111111111
shell = "unrestricted"

[[users]]
name = "bob"
telegram_id = 222222222
